# BlessForge -- CasaOS install file
#
# Use this one (NOT the repo's docker-compose.yml) to install through CasaOS:
#   CasaOS -> App Store -> Custom Install -> Import -> paste this file
#
# Why a separate file: the repo's docker-compose.yml uses `build: .` with the
# local tag `blessforge:latest`. CasaOS has no source checkout, so it ignores
# `build:` and tries to PULL `blessforge:latest` from Docker Hub -- which does
# not exist. The pull fails, the container is never created, and CasaOS reports
# the app as unhealthy. This file pulls the published image instead.
#
# ---------------------------------------------------------------------------
# THE CURSEFORGE KEY IS SET AS BASE64, ON PURPOSE
# CurseForge keys are bcrypt-style and contain '$' (e.g. $2a$10$D3Bo...), and
# every layer between this file and the app wants to interpolate that:
# Compose expands '$name', and CasaOS un-doubles '$$' when it stores an
# imported compose before handing the file back to Compose, which expands it
# AGAIN. No amount of doubling survives both -- the key silently arrives
# truncated and every CurseForge call 403s.
# Base64 contains no '$', so it passes through untouched. To use a different
# key:   echo -n '<your key>' | base64 -w0
# BlessForge decodes CURSEFORGE_API_KEY_B64 at startup, and still accepts a
# plain CURSEFORGE_API_KEY if you prefer to fight the escaping.
# ---------------------------------------------------------------------------

name: blessforge

services:
  blessforge:
    # Pulls the image CI publishes, so a machine with no source checkout can
    # install this file as-is.
    #
    # ON THE MACHINE YOU BUILD FROM, change this to the local tag instead:
    #     image: blessforge:latest
    # after a `docker compose build`. That is how ClassBell is installed here,
    # and it means CasaOS runs your working tree rather than whatever CI last
    # published. CasaOS is happy with a local tag as long as the image exists.
    image: ghcr.io/chargeyxd/blessforge:latest
    container_name: blessforge
    restart: unless-stopped

    # The default bridge, deliberately. A CasaOS box accumulates one network
    # per app and Docker's address pools run out after ~30, after which every
    # new project fails with "all predefined address pools have been fully
    # subnetted". BlessForge only talks outward, so it needs no private net.
    network_mode: bridge

    # Reach services on the host -- Ollama for the AI assistant, and Crafty
    # itself if it runs on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - target: 8710
        published: "8710"
        protocol: tcp

    environment:
      # ---- Crafty ------------------------------------------------------
      # Use the LAN IP, not 127.0.0.1: inside the container loopback is the
      # container itself and can never reach Crafty. Change this to the new
      # machine's Crafty address when moving to another server.
      CRAFTY_URL: "https://192.168.68.120:8443"
      # Crafty -> your user -> API keys. Needs Server Creation, Files,
      # Commands and Config permissions. A token is bound to the Crafty
      # instance that issued it, so a different Crafty needs its own.
      CRAFTY_TOKEN: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoxLCJpYXQiOjE3ODE0MzEzNTgsInRva2VuX2lkIjoxfQ.erjtmcCAfm4Z5Q7OU5-hl6Ez7hpMzJaZ_q132A10iXA"

      # ---- Mod sources -------------------------------------------------
      # Base64 of the CurseForge key. Deliberately NOT the raw key: it
      # contains '$', and every layer here wants to interpolate that --
      # Compose expands '$name', and CasaOS un-doubles '$$' when it stores an
      # imported compose before handing it back to Compose, which expands it
      # again. No amount of escaping survives both. Base64 has no '$'.
      #   echo -n '<your key>' | base64 -w0
      CURSEFORGE_API_KEY_B64: "JDJhJDEwJEQzQm9OUjFQLkZYNGJ3OEVTeU1XUXVVVHFkZlJaU2ZiZ1p3UUFYOHhyYk5Vd3lZT0FYdnNx"

      # ---- Optional ----------------------------------------------------
      # Crafty ships a self-signed certificate, so verification stays off
      # unless you installed a real one.
      CRAFTY_VERIFY_SSL: "false"
      MODRINTH_ENABLED: "true"

      # AI troubleshooting assistant. Leave OLLAMA_URL blank to disable.
      OLLAMA_URL: "http://host.docker.internal:11434"
      AI_MODEL: "qwen2.5:3b-instruct-q4_K_M"
      AI_ENABLED: "true"
      AI_TIMEOUT: "300"

      # BlessForge measures RAM/CPU from inside its own container. If Crafty
      # runs on a DIFFERENT machine, set these to describe that machine, or
      # the optimizer will size heaps against the wrong host.
      # HOST_RAM_GB: "16"
      # HOST_CPU_COUNT: "8"

      DOWNLOAD_CONCURRENCY: "8"
      SERVER_READY_TIMEOUT: "900"
      TZ: "UTC"

    volumes:
      # Modpack/mod download cache. Safe to delete; it only re-downloads.
      #
      # A named volume rather than the usual /DATA/AppData bind mount, on
      # purpose: CasaOS creates bind-mount directories as root, but this
      # container runs unprivileged as uid 1000, so it could not write there
      # and every download would fail to cache with a permission error.
      # Docker seeds a fresh named volume with the image's ownership, so this
      # works with no manual chown. It is only a disposable cache -- nothing
      # here needs to be browsable from the CasaOS file manager.
      - blessforge-cache:/data

    healthcheck:
      # /api/healthz is a static liveness probe -- it never touches Crafty or
      # CurseForge, so a misconfigured key cannot make the container look dead.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    x-casaos:
      author: ChargeyXD
      category: Games
      description:
        en_us: >-
          Install CurseForge modpacks into Crafty Controller, then manage mods
          with automatic dependency resolution, edit configs, tune JVM flags to
          the host's specs, and diagnose failed launches with a local AI model.
      developer: ChargeyXD
      hostname: ""
      icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
      index: /
      is_uncontrolled: false
      port_map: "8710"
      scheme: http
      store_app_id: blessforge
      tagline:
        en_us: CurseForge modpacks for Crafty, made manageable
      title:
        custom: ""
        en_us: BlessForge
      tips:
        before_install:
          en_us: >-
            Set CRAFTY_URL and CRAFTY_TOKEN for your Crafty instance. The
            CurseForge key is supplied as CURSEFORGE_API_KEY_B64 (base64),
            because a raw key contains '$' which Compose and CasaOS both
            mangle. To use your own: echo -n '<key>' | base64 -w0
      envs:
        - container: CRAFTY_URL
          description:
            en_us: "Crafty base URL, e.g. https://192.168.1.10:8443 (LAN IP, not localhost)"
        - container: CRAFTY_TOKEN
          description:
            en_us: "Crafty API token from your Crafty user profile"
        - container: CURSEFORGE_API_KEY_B64
          description:
            en_us: "CurseForge API key, base64 encoded: echo -n '<key>' | base64 -w0"
        - container: CRAFTY_VERIFY_SSL
          description:
            en_us: "Verify Crafty's TLS certificate (false for self-signed)"
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint for the AI assistant (blank to disable)"
        - container: AI_MODEL
          description:
            en_us: "Local model, e.g. qwen2.5:3b-instruct-q4_K_M"
        - container: HOST_RAM_GB
          description:
            en_us: "Override detected RAM when Crafty runs on another machine"
      ports:
        - container: "8710"
          description:
            en_us: "BlessForge web interface"
      volumes:
        - container: /data
          description:
            en_us: "Modpack and mod download cache"

volumes:
  blessforge-cache:

x-casaos:
  architectures:
    - amd64
    - arm64
  main: blessforge
  author: ChargeyXD
  category: Games
  description:
    en_us: >-
      A CurseForge-style browser for Crafty Controller: install modpacks,
      manage mods and configs, tune performance, and troubleshoot failed
      launches.
  developer: ChargeyXD
  icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
  tagline:
    en_us: CurseForge modpacks for Crafty, made manageable
  title:
    en_us: BlessForge
  port_map: "8710"
  scheme: http
  index: /
  store_app_id: blessforge
