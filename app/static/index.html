<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlessForge</title>
<link rel="icon" href="/static/img/appmark-fox.png">

<!-- Loaded non-blocking on purpose: this box is often on a LAN with no route
     out, and the app must paint immediately when fonts.googleapis.com never
     answers. The stacks in style.css stand in until (or unless) these land. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="shell">

  <!-- ============ FLEET SPINE ============ -->
  <aside class="spine" aria-label="Fleet">
    <div class="spine-head">
      <div class="appmark"><img src="/static/img/appmark-fox.png" alt=""></div>
      <div style="min-width:0">
        <div class="appmark-name">BlessForge</div>
        <div class="appmark-sub" id="shellSub">home rack</div>
      </div>
      <div class="spacer"></div>
      <button class="palette-btn" id="paletteBtn" title="Command palette"
              aria-label="Open the command palette"><span class="kbd">⌘K</span></button>
    </div>

    <nav class="spine-nav">
      <button class="nav-item" data-view="discover">
        <span class="glyph">⌕</span><span>Discover modpacks</span>
      </button>
      <button class="nav-item" data-view="activity">
        <span class="glyph">◴</span><span>Activity</span>
        <span class="spacer"></span>
        <span class="pill ember hidden" id="jobBadge"><span class="dot"></span><span id="jobBadgeN">0</span></span>
      </button>
    </nav>

    <div class="spine-section">
      <span>Fleet</span><span class="spacer"></span><span class="count" id="fleetSummary"></span>
    </div>
    <div class="fleet" id="fleet"></div>

    <div class="spine-foot">
      <button class="btn" style="width:100%" id="newServerBtn">+ New server from a modpack</button>
      <button class="nav-item" id="systemsToggle" style="margin-top:6px" aria-expanded="false">
        <span class="glyph">⚙</span><span>Systems</span>
        <span class="spacer"></span>
        <span class="pill" id="systemsPill"><span class="dot"></span><span id="systemsN">—</span></span>
      </button>
      <div id="systems" class="hidden" style="margin-top:6px"></div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="ctxTitle">BlessForge</h1>
        <span class="topbar-sub" id="ctxSub"></span>
      </div>
      <div class="spacer"></div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
      <button class="btn sm ghost" id="drawerBtn" title="Show running work">◴</button>
    </header>

    <main class="canvas" id="canvas"></main>
  </div>

  <div id="drawerHost"></div>
</div>

<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<div id="overlays"></div>

<script src="/static/app.js"></script>
</body>
</html>
