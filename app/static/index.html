<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Install and manage Minecraft servers on Crafty Controller: modpacks, mods, plugins, files, players and performance.">
<title>BlessForge</title>
<link rel="icon" href="/static/icon.png">

<!-- The two faces this image ships, vendored so a LAN box with no route to
     the internet paints immediately rather than waiting out a DNS timeout
     on a font. Loaded first because they are the fallback. -->
<link rel="stylesheet" href="/static/vendor/fonts.css">

<!-- Project Fox's own faces, when there is a route to fetch them. Loaded
     non-blocking: the page is already readable in Space Grotesk, and
     app.js stamps `no-archivo` on <html> when Archivo Black did not
     arrive so the fallback carries the display weight itself. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/app.css">

<script>
  // Applied before first paint so a dark-mode user never sees a cream flash.
  // Wrapped because a browser set to block site data throws on the read
  // itself rather than returning null.
  try {
    var t = localStorage.getItem('bf.theme');
    if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<noscript>
  <div style="max-width:640px;margin:60px auto;padding:24px;border:2.5px solid #241B28;background:#fff;color:#2E2432;font-family:system-ui,sans-serif">
    <h1 style="font-size:20px;margin:0 0 10px">BlessForge needs JavaScript</h1>
    <p>This is a control panel for live servers — every screen reads from the
      Crafty API as you use it, so there is no static version to fall back to.
      Enable JavaScript for this host and reload.</p>
  </div>
</noscript>

<a href="#main" class="skiplink">Skip to the main content</a>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
