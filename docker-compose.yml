name: blessforge

services:
  blessforge:
    build: .
    image: blessforge:latest
    container_name: blessforge
    restart: unless-stopped

    # BlessForge talks outward to Crafty, CurseForge/Modrinth, and Ollama.
    # Default bridge avoids consuming unnecessary Docker subnet address pools on CasaOS.
    network_mode: bridge

    # Lets the container reach host services (Ollama, local Crafty) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8710:8710"

    # Only the CurseForge key is baked in -- it is the one credential that is
    # the same on every install. Everything else reads from .env (copy
    # .env.example) with the fallback shown here, because Crafty's address and
    # token differ per machine and a token is only valid for the Crafty that
    # issued it.
    environment:
      # --- Crafty (per-machine: set these in .env) -----------------------
      # NOT hardcoded on purpose. A Crafty token is issued by, and only valid
      # for, the Crafty instance that created it, and every install points at
      # a different address -- so these have to come from the environment.
      # Left unset, the app starts and shows a setup banner saying what is
      # missing rather than failing obscurely.
      CRAFTY_URL: "${CRAFTY_URL:-}"
      CRAFTY_TOKEN: "${CRAFTY_TOKEN:-}"
      CRAFTY_VERIFY_SSL: "${CRAFTY_VERIFY_SSL:-false}"

      # --- Mod sources --------------------------------------------------
      # Base64 of the CurseForge key. Deliberately NOT the raw key: it
      # contains '$', and every layer here wants to interpolate that --
      # Compose expands '$name', and CasaOS un-doubles '$$' when it stores an
      # imported compose before handing it back to Compose, which expands it
      # again. No amount of escaping survives both. Base64 has no '$'.
      #   echo -n '<your key>' | base64 -w0
      CURSEFORGE_API_KEY_B64: "JDJhJDEwJEQzQm9OUjFQLkZYNGJ3OEVTeU1XUXVVVHFkZlJaU2ZiZ1p3UUFYOHhyYk5Vd3lZT0FYdnNx"

      # --- AI assistant (optional) --------------------------------------
      # Defaults suit a machine running Ollama locally; override per install.
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      AI_MODEL: "${AI_MODEL:-qwen2.5:3b-instruct-q4_K_M}"
      AI_ENABLED: "${AI_ENABLED:-true}"
      AI_TIMEOUT: "${AI_TIMEOUT:-300}"

      # --- Behaviour ----------------------------------------------------
      MODRINTH_ENABLED: "${MODRINTH_ENABLED:-true}"
      DOWNLOAD_CONCURRENCY: "${DOWNLOAD_CONCURRENCY:-8}"
      SERVER_READY_TIMEOUT: "${SERVER_READY_TIMEOUT:-900}"
      DEFAULT_MEM_MIN: "${DEFAULT_MEM_MIN:-2}"
      DEFAULT_MEM_MAX: "${DEFAULT_MEM_MAX:-6}"
      TZ: "${TZ:-UTC}"

      # Set these only if Crafty runs on a DIFFERENT machine, so the optimizer
      # sizes heaps against that host rather than this container.
      HOST_RAM_GB: "${HOST_RAM_GB:-}"
      HOST_CPU_COUNT: "${HOST_CPU_COUNT:-}"

    env_file:
      - path: .env
        required: false
        format: raw

    volumes:
      # Named volume for modpack & mod download cache with proper image ownership.
      - blessforge-cache:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/api/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s

    # ---- CasaOS app-store metadata ------------------------------------
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: blessforge
      author: BlessForge
      category: Utilities
      description:
        en_us: >-
          A CurseForge and Modrinth browser & management studio for Crafty Controller.
          Search modpacks and assemble server builds, review client mod stripping,
          manage mods with automatic recursive dependency resolution, edit configs,
          tune JVM flags to the host specs, and diagnose launch issues with a local AI assistant.
      developer: BlessForge
      icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/minecraft.png
      tagline:
        en_us: CurseForge modpacks for Crafty Controller, made manageable
      title:
        en_us: BlessForge
      port_map: "8710"
      scheme: http
      index: /
      envs:
        - container: CRAFTY_URL
          description:
            en_us: "Crafty Controller base URL, e.g. https://192.168.1.100:8443 (use LAN IP, not localhost)"
        - container: CRAFTY_TOKEN
          description:
            en_us: "Crafty API token (Crafty > User Profile > API Keys)"
        - container: CURSEFORGE_API_KEY_B64
          description:
            en_us: "CurseForge Core API key, base64 encoded: echo -n '<key>' | base64 -w0"
        - container: CRAFTY_VERIFY_SSL
          description:
            en_us: "Verify Crafty TLS cert (leave false for self-signed)"
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint for local AI diagnostics (e.g. http://host.docker.internal:11434)"
        - container: AI_MODEL
          description:
            en_us: "Local Ollama model name, e.g. qwen2.5:3b-instruct-q4_K_M"
        - container: HOST_RAM_GB
          description:
            en_us: "Manual RAM override (GB) if Crafty runs on another machine"
      volumes:
        - container: /data
          description:
            en_us: "Modpack download and assembly cache"

volumes:
  blessforge-cache:

x-casaos:
  architectures:
    - amd64
    - arm64
  main: blessforge
  author: BlessForge
  category: Utilities
  description:
    en_us: >-
      Install CurseForge modpacks into Crafty Controller, then manage mods,
      configs, performance and startup problems from one place.
  developer: BlessForge
  tagline:
    en_us: CurseForge modpacks for Crafty, made manageable
  title:
    en_us: BlessForge
  icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/minecraft.png
  port_map: "8710"
  scheme: http
  index: /
