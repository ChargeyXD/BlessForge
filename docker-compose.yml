# BlessForge -- one compose file, installable as-is.
#
#   CasaOS:  App Store -> Custom Install -> Import -> paste this file
#   CLI:     docker compose up -d
#
# This file pulls the image CI publishes to GHCR, so a machine with no source
# checkout can install it unchanged. On a machine that HAS the checkout,
# docker-compose.override.yml is picked up automatically and rebuilds the same
# tag from source -- so `docker compose up -d --build` here runs your working
# tree, and nothing else needs editing.
#
# ---------------------------------------------------------------------------
# THE CURSEFORGE KEY IS YOURS, AND IT IS NEVER IN THIS FILE
# Set it in the CasaOS dialog, in .env (a checkout reads it in raw format), or
# as a Docker secret named by CURSEFORGE_API_KEY_FILE. In the dialog, pass it
# as base64 (CURSEFORGE_API_KEY_B64), because:
# CurseForge keys are bcrypt-style and contain '$' (e.g. $2a$10$...), and
# every layer between this file and the app wants to interpolate that: Compose
# expands '$name', and CasaOS un-doubles '$$' when it stores an imported
# compose before handing the file back to Compose, which expands it AGAIN. No
# amount of doubling survives both -- the key silently arrives truncated and
# every CurseForge call 403s. Base64 contains no '$', so it passes through
# untouched. To use a different key:  echo -n '<your key>' | base64 -w0
# BlessForge decodes CURSEFORGE_API_KEY_B64 at startup, and still accepts a
# plain CURSEFORGE_API_KEY if you prefer to fight the escaping.
# ---------------------------------------------------------------------------

name: blessforge

services:
  blessforge:
    image: ghcr.io/chargeyxd/blessforge:latest
    container_name: blessforge
    restart: unless-stopped

    # A ceiling, not a target. Installs stream to disk rather than buffering
    # in memory, so the heaviest real workload measured here -- a 301-mod
    # preflight over the network, and a 91-mod / 260 MB install -- peaks
    # around 400 MB and settles back near 60 MB. 1 GB is comfortable headroom
    # and it matters on this kind of box: the RAM BlessForge is not using is
    # RAM a Minecraft server can have. Raise it if you install packs far
    # larger than that; it is not a soft limit, the container is killed.
    mem_limit: 1g

    # The project's own network, which the database needs: on Docker's
    # default bridge containers cannot find each other by name. That costs
    # one of the ~30 address pools a CasaOS box has (past them, every new
    # project fails with "all predefined address pools have been fully
    # subnetted") -- one network for the whole app, not one per service.
    #
    # It is named on every service, not left to Compose's implicit default:
    # CasaOS's import gives a service with no `networks:` its own
    # `network_mode: bridge`, which puts all five containers on Docker's
    # default bridge -- where `postgres`, `redis` and `agent` do not resolve,
    # so the panel and the worker die on start and the agent is never set up.
    networks:
      - blessforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    # Reach services on the host: an Ollama for the AI assistant, and a node
    # agent when it runs on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - target: 8710
        published: "8710"
        protocol: tcp

    environment:
      # ---- The engine ----------------------------------------------------
      # What runs the servers: BlessForge node agents. The `agent` service
      # below is this machine's own, and the panel registers it by itself on
      # its first start (the four LOCAL_* settings) -- there is nothing to set
      # up by hand. More machines can be added as nodes later. "mock" instead
      # keeps everything in memory, for trying the interface with no servers.
      ENGINE: "agent"
      LOCAL_AGENT_URL: "http://agent:8443"
      LOCAL_AGENT_CONFIG: "/node/agent.toml"
      LOCAL_PANEL_URL: "http://blessforge:8710"
      # Where game servers live. The SAME path on the host and in the agent's
      # container: the agent mounts each server's folder into its game
      # container by this path.
      LOCAL_SERVERS_ROOT: "/DATA/AppData/blessforge/servers"

      # ---- The database --------------------------------------------------
      # Accounts, sessions, the audit log, racks and decisions live in the
      # Postgres service below. POSTGRES_PASSWORD must be the same value on
      # all three services (this one, the worker and postgres); BlessForge
      # puts it into DATABASE_URL itself, so the URL carries no password.
      # Postgres keeps the password it was first created with: change it
      # before the first start. The database is never published outside
      # this compose project.
      DATABASE_URL: "postgresql+asyncpg://blessforge@postgres:5432/blessforge"
      POSTGRES_PASSWORD: "CHANGE-ME"

      # ---- The job queue ----------------------------------------------------
      # Installs, provisioning and the update sweep run in the worker service
      # below, so restarting this container mid-install does not stop the
      # install. Remove this line and the worker to run them in-process.
      REDIS_URL: "redis://redis:6379/0"

      # ---- Mod sources --------------------------------------------------
      # Your own CurseForge key, base64-encoded: echo -n '<key>' | base64 -w0
      # TEMPORARY: the owner's key is set here for their own deployment while
      # the repository is private. Blank it again before the repo or this
      # file is shared -- dev/tools/test_blocked_downloads.py fails until then.
      CURSEFORGE_API_KEY_B64: "JDJhJDEwJEQzQm9OUjFQLkZYNGJ3OEVTeU1XUXVVVHFkZlJaU2ZiZ1p3UUFYOHhyYk5Vd3lZT0FYdnNx"
      MODRINTH_ENABLED: "true"

      # ---- AI troubleshooting assistant (optional, off by default) -------
      # An Ollama YOU run (README: "AI assistant"). Blank turns the assistant
      # off; everything else keeps working. Never point this at an endpoint
      # somebody else operates -- crash reports and mod lists are sent to it.
      OLLAMA_URL: ""
      # Only needed if that endpoint is behind an authenticating proxy.
      OLLAMA_API_KEY: ""
      # The assistant can be switched to a local Ollama from its own panel.
      # This has to be host.docker.internal, NOT localhost: inside a container
      # localhost is the container itself, where nothing is listening, so the
      # toggle would connect to nothing and report the endpoint as down. The
      # host-gateway alias above is what makes this resolve.
      OLLAMA_LOCAL_URL: "http://host.docker.internal:11434"
      AI_MODEL: "qwen3:4b-instruct"
      AI_ENABLED: "true"
      AI_TIMEOUT: "300"

      # ---- Game ports ---------------------------------------------------
      # The range your router (or playit / a tunnel) forwards to this
      # machine. Servers can use any free port; one outside this range gets a
      # warning in its Port control, because nobody outside could reach it.
      # Crafty on the same machine publishes all of 25500-25600 whether its
      # servers use them or not, so while both run, give BlessForge's servers
      # ports Crafty does not hold -- and forward those.
      GAME_PORT_RANGE: "25500-25600"

      # ---- Behaviour ----------------------------------------------------
      DOWNLOAD_CONCURRENCY: "8"
      SERVER_READY_TIMEOUT: "900"
      TZ: "UTC"

      # Heaps are sized against the node's own RAM and CPUs, which the agent
      # reports. Set these only to override that reading.
      # HOST_RAM_GB: "16"
      # HOST_CPU_COUNT: "8"

    volumes:
      # BlessForge's own folder: the modpack/mod download cache, plus any pack
      # exports you imported. The cache is disposable; the imports are not.
      #
      # This MUST be a folder of its own, and the path has to be spelled out
      # here. A named volume looks tidier but leaves the host path blank in
      # CasaOS's install dialog, and an unassigned row there is filled in by
      # hand -- which is how this once ended up bind-mounted onto another
      # app's folder, where it could not write a single byte and every install
      # failed with no visible error. The container starts as root purely to
      # chown this folder and then drops to uid 1000 (see entrypoint.sh), so a
      # root-created bind mount works with no manual chown.
      - /DATA/AppData/blessforge/data:/data
      # Where the panel writes the bundled agent's config, and the agent reads
      # it. Holds the agent's token: keep it to this app.
      - /DATA/AppData/blessforge/node:/node
      # Moving servers off Crafty (README "Updating from 2.1"): give the panel
      # Crafty's servers folder, read-only, and point --from-dir at it.
      # - /DATA/AppData/big-bear-crafty/servers:/crafty-servers:ro

    healthcheck:
      # /api/healthz is a static liveness probe -- it never touches a node or
      # CurseForge, so a misconfigured key cannot make the container look dead.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    x-casaos:
      author: ChargeyXD
      category: Games
      description:
        en_us: >-
          A Minecraft server panel: install CurseForge modpacks or a pack you
          exported yourself as real servers, boot-checked and repaired
          automatically, then manage mods, configs, players and performance.
      developer: ChargeyXD
      hostname: ""
      icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
      index: /
      is_uncontrolled: false
      port_map: "8710"
      scheme: http
      store_app_id: blessforge
      tagline:
        en_us: CurseForge modpacks as real servers, made manageable
      title:
        custom: ""
        en_us: BlessForge
      tips:
        before_install:
          en_us: >-
            Paste your own CurseForge key, base64 encoded (echo -n KEY |
            base64 -w0), as CURSEFORGE_API_KEY_B64, and change
            POSTGRES_PASSWORD -- the same value on all three (blessforge,
            worker and postgres). BlessForge runs its game servers itself
            (the agent service); nothing else needs setting up. Leave the
            /data folder pointing at /DATA/AppData/blessforge/data -- it is
            BlessForge's own folder, not Crafty's.
      envs:
        - container: CURSEFORGE_API_KEY_B64
          description:
            en_us: "CurseForge API key, base64 encoded: echo -n '<key>' | base64 -w0"
        - container: POSTGRES_PASSWORD
          description:
            en_us: "Database password: the same value on all three (blessforge, worker and postgres). Postgres keeps the one it was first created with."
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint for the AI assistant (blank to disable)"
        - container: OLLAMA_API_KEY
          description:
            en_us: "Bearer token, if the Ollama endpoint requires one"
        - container: OLLAMA_LOCAL_URL
          description:
            en_us: "The 'local' option in the assistant's endpoint switch. Use host.docker.internal, not localhost -- inside the container localhost is the container."
        - container: AI_MODEL
          description:
            en_us: "Model to use, e.g. qwen3:4b-instruct"
        - container: HOST_RAM_GB
          description:
            en_us: "Override the RAM the node reports, for heap sizing"
      ports:
        - container: "8710"
          description:
            en_us: "BlessForge web interface"
      volumes:
        - container: /data
          host: /DATA/AppData/blessforge/data
          mode: rw
          description:
            en_us: "BlessForge's own folder: modpack download cache and imported pack exports. Give it an empty folder of its own -- not Crafty's."

  # The job worker: the same image, running the queue instead of the web
  # app. It needs the same database, Redis, engine and /data as the API --
  # an export it writes is downloaded through the API from /data/exports.
  worker:
    image: ghcr.io/chargeyxd/blessforge:latest
    container_name: blessforge-worker
    restart: unless-stopped
    command: ["arq", "app.worker.WorkerSettings"]
    # The heavy one now: it downloads and repacks modpacks. Same ceiling
    # the API had when it did the work itself.
    mem_limit: 1g
    networks:
      - blessforge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENGINE: "agent"
      DATABASE_URL: "postgresql+asyncpg://blessforge@postgres:5432/blessforge"
      # The same value as on the panel and on postgres.
      POSTGRES_PASSWORD: "CHANGE-ME"
      REDIS_URL: "redis://redis:6379/0"
      CURSEFORGE_API_KEY_B64: "JDJhJDEwJEQzQm9OUjFQLkZYNGJ3OEVTeU1XUXVVVHFkZlJaU2ZiZ1p3UUFYOHhyYk5Vd3lZT0FYdnNx"
      MODRINTH_ENABLED: "true"
      OLLAMA_URL: ""
      WORKER_CONCURRENCY: "3"
      TZ: "UTC"
    volumes:
      - /DATA/AppData/blessforge/data:/data
    # It needs a healthcheck of its own, and `disable: true` is not one: the
    # image's probes the web port, which the worker does not serve, and a
    # disabled check makes `docker compose up --wait` -- how CasaOS installs
    # -- fail with "container blessforge-worker has no healthcheck
    # configured". This reads arq's liveness key, which the worker refreshes
    # every 60 s (health_check_interval in app/worker.py) and which expires a
    # second after that. Plain redis, not `arq --check`: that imports the
    # whole app every 30 s.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, redis; sys.exit(0 if redis.Redis.from_url(os.environ['REDIS_URL'], socket_timeout=3).exists('arq:queue:health-check') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 5s

  # This machine's node agent: it starts and stops the game servers, each in
  # its own locked-down container (memory, CPU and process limits, no
  # capabilities, read-only root, only its own folder mounted). Same image,
  # running `python -m agent`. It waits for the panel to register it and
  # write /node/agent.toml on the panel's first start, then reports in.
  #
  # It is the one container given the Docker socket -- that is how it creates
  # game containers -- and it runs as uid 1000 with only the socket's group.
  # Runtime images (one per Java version) are pulled, or built here from the
  # Dockerfile the agent ships with when they cannot be.
  #
  # PORTS: there is no `ports:` range here, and there should not be. Crafty
  # runs every server inside its one container, so it has to publish a whole
  # range (25500-25600) up front. Here each server is a container of its own,
  # and the agent publishes that server's ports on this machine when it
  # starts it: the game port on TCP and UDP, plus whatever its add-ons open
  # -- Geyser for Bedrock players, Simple Voice Chat, Plasmo Voice, Dynmap,
  # BlueMap, squaremap, a separate query port -- read from the server's own
  # config files (agent/addons.py). RCON is never published. A range here
  # would only take those ports away from the servers.
  agent:
    image: ghcr.io/chargeyxd/blessforge:latest
    container_name: blessforge-agent
    restart: unless-stopped
    command: ["python", "-m", "agent"]
    mem_limit: 256m
    networks:
      - blessforge
    # Its player pings go to the game ports it published on this machine,
    # which from inside this container is host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BLESSFORGE_AGENT_CONFIG: "/node/agent.toml"
      BLESSFORGE_AGENT_WAIT: "1"
      LOCAL_SERVERS_ROOT: "/DATA/AppData/blessforge/servers"
      TZ: "UTC"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The same path on both sides -- see LOCAL_SERVERS_ROOT above.
      - /DATA/AppData/blessforge/servers:/DATA/AppData/blessforge/servers
      - /DATA/AppData/blessforge/agent:/var/lib/blessforge-agent
      - /DATA/AppData/blessforge/node:/node:ro
    # Healthy once the panel has registered it and it is serving -- the
    # install waits for that, so it is probed every 5 s until then.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s

  redis:
    image: redis:7-alpine
    container_name: blessforge-redis
    restart: unless-stopped
    mem_limit: 128m
    networks:
      - blessforge
    # Append-only, so a queued job and a job's history survive a restart of
    # Redis itself -- the whole point of the queue.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - /DATA/AppData/blessforge/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  postgres:
    image: postgres:16-alpine
    container_name: blessforge-postgres
    restart: unless-stopped
    # Small: BlessForge's tables are accounts, sessions and records, not
    # worlds. The RAM it does not take is RAM a Minecraft server can have.
    mem_limit: 512m
    networks:
      - blessforge
    environment:
      POSTGRES_USER: "blessforge"
      # The same value as POSTGRES_PASSWORD on the panel and the worker.
      # Only read when the database is first created.
      POSTGRES_PASSWORD: "CHANGE-ME"
      POSTGRES_DB: "blessforge"
    volumes:
      # Its own folder beside BlessForge's, spelled out for the same reason
      # as /data: a named volume leaves a blank row in the CasaOS dialog.
      - /DATA/AppData/blessforge/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blessforge -d blessforge"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

# The one network every service above names (see the panel's `networks:`).
networks:
  blessforge:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  main: blessforge
  author: ChargeyXD
  category: Games
  description:
    en_us: >-
      A Minecraft server panel that runs its own servers: install CurseForge
      modpacks or your own exports, boot-checked and repaired automatically,
      then manage mods, configs, players and performance.
  developer: ChargeyXD
  icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
  index: /
  port_map: "8710"
  scheme: http
  store_app_id: blessforge
  tagline:
    en_us: CurseForge modpacks as real servers, made manageable
  thumbnail: ""
  title:
    en_us: BlessForge
  tips:
    before_install:
      en_us: >-
        Set your CurseForge key (base64) and POSTGRES_PASSWORD -- the same
        value on all three (blessforge, worker and postgres) -- then open
        the app -- it runs its own game servers and tells you on the first
        screen if anything is still missing. Crafty is not needed; servers
        already in Crafty can be moved across (README, "Updating from 2.1").
