name: blessforge

services:
  blessforge:
    build: .
    image: blessforge:latest
    container_name: blessforge
    restart: unless-stopped

    # BlessForge talks outward to Crafty, CurseForge/Modrinth, and Ollama.
    # Default bridge avoids consuming unnecessary Docker subnet address pools on CasaOS.
    network_mode: bridge

    # Lets the container reach host services (Ollama, local Crafty) as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8710:8710"

    # Environment variables are loaded directly from .env (copy .env.example).
    env_file:
      - path: .env
        required: false

    volumes:
      # Named volume for modpack & mod download cache with proper image ownership.
      - blessforge-cache:/data

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/api/healthz"]
      interval: 20s
      timeout: 4s
      retries: 3
      start_period: 10s

    # ---- CasaOS app-store metadata ------------------------------------
    x-casaos:
      architectures:
        - amd64
        - arm64
      main: blessforge
      author: BlessForge
      category: Utilities
      description:
        en_us: >-
          A CurseForge and Modrinth browser & management studio for Crafty Controller.
          Search modpacks and assemble server builds, review client mod stripping,
          manage mods with automatic recursive dependency resolution, edit configs,
          tune JVM flags to the host specs, and diagnose launch issues with a local AI assistant.
      developer: BlessForge
      icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/minecraft.png
      tagline:
        en_us: CurseForge modpacks for Crafty Controller, made manageable
      title:
        en_us: BlessForge
      port_map: "8710"
      scheme: http
      index: /
      envs:
        - container: CRAFTY_URL
          description:
            en_us: "Crafty Controller base URL, e.g. https://192.168.1.100:8443 (use LAN IP, not localhost)"
        - container: CRAFTY_TOKEN
          description:
            en_us: "Crafty API token (Crafty > User Profile > API Keys)"
        - container: CURSEFORGE_API_KEY
          description:
            en_us: "CurseForge Core API key from console.curseforge.com (double $$ if setting via UI)"
        - container: CRAFTY_VERIFY_SSL
          description:
            en_us: "Verify Crafty TLS cert (leave false for self-signed)"
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint for local AI diagnostics (e.g. http://host.docker.internal:11434)"
        - container: AI_MODEL
          description:
            en_us: "Local Ollama model name, e.g. qwen2.5:3b-instruct-q4_K_M"
        - container: HOST_RAM_GB
          description:
            en_us: "Manual RAM override (GB) if Crafty runs on another machine"
      volumes:
        - container: /data
          description:
            en_us: "Modpack download and assembly cache"

volumes:
  blessforge-cache:

x-casaos:
  architectures:
    - amd64
    - arm64
  main: blessforge
  author: BlessForge
  category: Utilities
  description:
    en_us: >-
      Install CurseForge modpacks into Crafty Controller, then manage mods,
      configs, performance and startup problems from one place.
  developer: BlessForge
  tagline:
    en_us: CurseForge modpacks for Crafty, made manageable
  title:
    en_us: BlessForge
  icon: https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/png/minecraft.png
  port_map: "8710"
  scheme: http
  index: /
