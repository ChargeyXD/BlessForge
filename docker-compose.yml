# BlessForge -- one compose file, installable as-is.
#
#   CasaOS:  App Store -> Custom Install -> Import -> paste this file
#   CLI:     docker compose up -d
#
# This file pulls the image CI publishes to GHCR, so a machine with no source
# checkout can install it unchanged. On a machine that HAS the checkout,
# docker-compose.override.yml is picked up automatically and rebuilds the same
# tag from source -- so `docker compose up -d --build` here runs your working
# tree, and nothing else needs editing.
#
# ---------------------------------------------------------------------------
# THE CURSEFORGE KEY IS SET AS BASE64, ON PURPOSE
# CurseForge keys are bcrypt-style and contain '$' (e.g. $2a$10$D3Bo...), and
# every layer between this file and the app wants to interpolate that: Compose
# expands '$name', and CasaOS un-doubles '$$' when it stores an imported
# compose before handing the file back to Compose, which expands it AGAIN. No
# amount of doubling survives both -- the key silently arrives truncated and
# every CurseForge call 403s. Base64 contains no '$', so it passes through
# untouched. To use a different key:  echo -n '<your key>' | base64 -w0
# BlessForge decodes CURSEFORGE_API_KEY_B64 at startup, and still accepts a
# plain CURSEFORGE_API_KEY if you prefer to fight the escaping.
# ---------------------------------------------------------------------------

name: blessforge

services:
  blessforge:
    image: ghcr.io/chargeyxd/blessforge:latest
    container_name: blessforge
    restart: unless-stopped

    # A ceiling, not a target. Installs stream to disk rather than buffering
    # in memory, so the heaviest real workload measured here -- a 301-mod
    # preflight over the network, and a 91-mod / 260 MB install -- peaks
    # around 400 MB and settles back near 60 MB. 1 GB is comfortable headroom
    # and it matters on this kind of box: the RAM BlessForge is not using is
    # RAM a Minecraft server can have. Raise it if you install packs far
    # larger than that; it is not a soft limit, the container is killed.
    mem_limit: 1g

    # The default bridge, deliberately. A CasaOS box accumulates one network
    # per app and Docker's address pools run out after about thirty, after
    # which every new project fails with "all predefined address pools have
    # been fully subnetted". BlessForge only talks outward, so it needs no
    # private network of its own.
    network_mode: bridge

    # Reach services on the host: Ollama for the AI assistant, and Crafty
    # itself when it runs on this same machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - target: 8710
        published: "8710"
        protocol: tcp

    environment:
      # ---- Crafty: SET THESE FOR THIS MACHINE ---------------------------
      # The only two values that must change per install; both are editable in
      # the CasaOS install dialog.
      #
      # Use the LAN IP, not 127.0.0.1 -- inside the container loopback is the
      # container itself and can never reach Crafty.
      #
      # The port is whatever YOUR Crafty is published on, and the two CasaOS
      # Crafty apps do not agree: the "Crafty Controller" app publishes 8111,
      # big-bear-crafty publishes 8443. Check the port on the Crafty tile in
      # CasaOS. Keep the https:// -- Crafty speaks TLS on both.
      CRAFTY_URL: "https://CHANGE-ME:8443"
      # Crafty -> your user -> API keys. Needs Server Creation, Files, Commands
      # and Config permissions. A token is issued by, and only valid for, the
      # Crafty instance that created it, so each install needs its own. Left
      # blank, BlessForge still starts and shows a setup screen naming exactly
      # what is missing.
      CRAFTY_TOKEN: ""
      # Crafty ships a self-signed certificate, so verification stays off
      # unless you installed a real one.
      CRAFTY_VERIFY_SSL: "false"

      # ---- Mod sources: shared, no need to change -----------------------
      CURSEFORGE_API_KEY_B64: "JDJhJDEwJEQzQm9OUjFQLkZYNGJ3OEVTeU1XUXVVVHFkZlJaU2ZiZ1p3UUFYOHhyYk5Vd3lZT0FYdnNx"
      MODRINTH_ENABLED: "true"

      # ---- AI troubleshooting assistant (optional) ----------------------
      # A shared Ollama endpoint rather than one on this host: the box running
      # Crafty needs its CPU for the Minecraft servers. Leave OLLAMA_URL blank
      # to disable the assistant entirely; everything else keeps working.
      OLLAMA_URL: "https://ai.shadowco.xyz"
      # Only needed if that endpoint is behind an authenticating proxy.
      OLLAMA_API_KEY: ""
      # The assistant can be switched to a local Ollama from its own panel.
      # This has to be host.docker.internal, NOT localhost: inside a container
      # localhost is the container itself, where nothing is listening, so the
      # toggle would connect to nothing and report the endpoint as down. The
      # host-gateway alias above is what makes this resolve.
      OLLAMA_LOCAL_URL: "http://host.docker.internal:11434"
      AI_MODEL: "qwen3:4b-instruct"
      AI_ENABLED: "true"
      AI_TIMEOUT: "300"

      # ---- Behaviour ----------------------------------------------------
      DOWNLOAD_CONCURRENCY: "8"
      SERVER_READY_TIMEOUT: "900"
      TZ: "UTC"

      # BlessForge measures RAM and CPU from inside its own container. If
      # Crafty runs on a DIFFERENT machine, set these to describe that machine
      # or the optimizer will size heaps against the wrong host.
      # HOST_RAM_GB: "16"
      # HOST_CPU_COUNT: "8"

    volumes:
      # BlessForge's own folder: the modpack/mod download cache, plus any pack
      # exports you imported. The cache is disposable; the imports are not.
      #
      # This MUST be a folder of its own, and the path has to be spelled out
      # here. A named volume looks tidier but leaves the host path blank in
      # CasaOS's install dialog, and an unassigned row there is filled in by
      # hand -- which is how this once ended up bind-mounted onto Crafty's
      # AppData, where the app could not write a single byte and every install
      # failed with no visible error. The container starts as root purely to
      # chown this folder and then drops to uid 1000 (see entrypoint.sh), so a
      # root-created bind mount works with no manual chown.
      - /DATA/AppData/blessforge/data:/data

    healthcheck:
      # /api/healthz is a static liveness probe -- it never touches Crafty or
      # CurseForge, so a misconfigured key cannot make the container look dead.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8710/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    x-casaos:
      author: ChargeyXD
      category: Games
      description:
        en_us: >-
          Install CurseForge modpacks into Crafty Controller, or import a pack
          you exported yourself, then manage mods with automatic dependency
          resolution, edit configs, tune JVM flags to the host's specs, and
          diagnose failed launches with a local AI model.
      developer: ChargeyXD
      hostname: ""
      icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
      index: /
      is_uncontrolled: false
      port_map: "8710"
      scheme: http
      store_app_id: blessforge
      tagline:
        en_us: CurseForge modpacks for Crafty, made manageable
      title:
        custom: ""
        en_us: BlessForge
      tips:
        before_install:
          en_us: >-
            Set CRAFTY_URL to this machine's Crafty address -- LAN IP, not
            localhost, and the port your Crafty tile actually shows (8111 for
            the CasaOS Crafty app, 8443 for big-bear-crafty). Set CRAFTY_TOKEN
            to a token from that Crafty's user profile; a token only works on
            the Crafty that issued it. The CurseForge key is already filled in.
            Leave the /data folder pointing at /DATA/AppData/blessforge/data --
            it is BlessForge's own cache, not Crafty's directory.
      envs:
        - container: CRAFTY_URL
          description:
            en_us: "Crafty base URL with its published port -- https://<LAN-IP>:8111 for the CasaOS Crafty app, https://<LAN-IP>:8443 for big-bear-crafty. Not localhost."
        - container: CRAFTY_TOKEN
          description:
            en_us: "Crafty API token from your Crafty user profile"
        - container: CURSEFORGE_API_KEY_B64
          description:
            en_us: "CurseForge API key, base64 encoded: echo -n '<key>' | base64 -w0"
        - container: CRAFTY_VERIFY_SSL
          description:
            en_us: "Verify Crafty's TLS certificate (false for self-signed)"
        - container: OLLAMA_URL
          description:
            en_us: "Ollama endpoint for the AI assistant (blank to disable)"
        - container: OLLAMA_API_KEY
          description:
            en_us: "Bearer token, if the Ollama endpoint requires one"
        - container: OLLAMA_LOCAL_URL
          description:
            en_us: "The 'local' option in the assistant's endpoint switch. Use host.docker.internal, not localhost -- inside the container localhost is the container."
        - container: AI_MODEL
          description:
            en_us: "Model to use, e.g. qwen3:4b-instruct"
        - container: HOST_RAM_GB
          description:
            en_us: "Override detected RAM when Crafty runs on another machine"
      ports:
        - container: "8710"
          description:
            en_us: "BlessForge web interface"
      volumes:
        - container: /data
          host: /DATA/AppData/blessforge/data
          mode: rw
          description:
            en_us: "BlessForge's own folder: modpack download cache and imported pack exports. Give it an empty folder of its own -- not Crafty's."

x-casaos:
  architectures:
    - amd64
    - arm64
  main: blessforge
  author: ChargeyXD
  category: Games
  description:
    en_us: >-
      A CurseForge-style browser for Crafty Controller: install modpacks or
      import your own exports, manage mods and configs, tune performance, and
      troubleshoot failed launches.
  developer: ChargeyXD
  icon: https://raw.githubusercontent.com/ChargeyXD/BlessForge/main/app/static/icon.png
  index: /
  port_map: "8710"
  scheme: http
  store_app_id: blessforge
  tagline:
    en_us: CurseForge modpacks for Crafty, made manageable
  thumbnail: ""
  title:
    en_us: BlessForge
  tips:
    before_install:
      en_us: >-
        BlessForge needs a Crafty Controller instance on your network. Set
        CRAFTY_URL to its LAN address and CRAFTY_TOKEN to an API token from
        that Crafty's user profile, then open the app -- it tells you on the
        first screen if anything is still missing.
