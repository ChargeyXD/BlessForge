# Local development only. Compose picks this up automatically when you run
# `docker compose` from a checkout, and CasaOS never sees it -- it imports
# docker-compose.yml alone.
#
# What it changes:
#   * builds the image from source and tags it with the same GHCR name, so the
#     installed app runs your working tree instead of whatever CI last
#     published (`docker compose up -d --build`);
#   * reads .env for the per-machine settings, in `raw` format so a
#     CurseForge key containing '$' is not mangled by Compose interpolation
#     (needs Compose v2.24+).
#
# Note that both files name the same container, so running compose from this
# checkout takes the CasaOS-installed container over. That is usually what you
# want while developing; to hand it back, run
#   docker compose -p blessforge -f /var/lib/casaos/apps/blessforge/docker-compose.yml up -d --force-recreate

services:
  blessforge:
    build: .
    pull_policy: never
    env_file:
      - path: .env
        required: false
        format: raw
