# Alembic owns BlessForge's schema. The app runs `upgrade head` itself on
# start (app/db/__init__.py), so this file is for the CLI:
#
#   DATABASE_URL=postgresql+asyncpg://... alembic upgrade head
#   DATABASE_URL=postgresql+asyncpg://... alembic revision --autogenerate -m "..."
#
# The URL always comes from DATABASE_URL, never from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
